<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future Kimonos — Inspiration</title>
<style>
  :root{
    --bg:#0a0a09; --panel:#121211; --card:#141413;
    --ink:#f0eee9; --muted:#8a877f; --faint:#5a5852;
    --line:#26251f; --line2:#38362e;
    --accent:#ED1F24; --star:#E8C46A;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:400 14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;}

  /* ── masthead ─────────────────────────────────────────────── */
  header{position:sticky;top:0;z-index:40;background:rgba(10,10,9,.94);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
  .bar{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
    padding:20px 34px 0;max-width:1700px;margin:0 auto;}
  h1{margin:0;font-size:23px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;}
  h1 span{color:var(--accent)}
  .run{font-size:11px;color:var(--faint);letter-spacing:.13em;text-transform:uppercase}
  .spacer{flex:1}
  .ctl{display:flex;align-items:center;gap:10px}
  .stat{font-size:11px;color:var(--muted);letter-spacing:.05em;font-variant-numeric:tabular-nums}
  .stat b{color:var(--ink);font-weight:500}
  select,button{font:inherit;font-size:12px;color:var(--ink);background:transparent;
    border:1px solid var(--line2);border-radius:2px;padding:6px 12px;cursor:pointer;
    letter-spacing:.06em;text-transform:uppercase;transition:.15s}
  select:hover,button:hover{border-color:var(--muted)}
  button.go{background:var(--accent);border-color:var(--accent);color:#fff}
  button.go:hover{filter:brightness(1.12)}

  /* ── filters ──────────────────────────────────────────────── */
  .filters{max-width:1700px;margin:0 auto;padding:14px 34px 16px;
    display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .flab{font-size:9.5px;color:var(--faint);letter-spacing:.18em;text-transform:uppercase;
    margin:0 6px 0 0}
  .chip{font-size:11px;padding:4px 11px;border:1px solid var(--line);border-radius:2px;
    color:var(--muted);cursor:pointer;user-select:none;letter-spacing:.04em;transition:.15s;
    white-space:nowrap}
  .chip:hover{border-color:var(--line2);color:var(--ink)}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip.on.red{background:var(--accent);border-color:var(--accent);color:#fff}
  .brk{flex-basis:100%;height:0}

  /* ── page ─────────────────────────────────────────────────── */
  main{max-width:1700px;margin:0 auto;padding:0 34px 100px}
  .lede{max-width:70ch;font-size:13.5px;line-height:1.75;color:var(--muted);
    padding:20px 0 14px;border-bottom:1px solid var(--line);margin-bottom:0;font-size:12.5px;line-height:1.65;max-height:5.4em;overflow:hidden}

  .tier{padding:34px 0 0}
  .tierhead{display:flex;align-items:baseline;gap:16px;
    border-bottom:1px solid var(--line2);padding-bottom:12px;margin-bottom:6px}
  .tierhead h2{margin:0;font-size:22px;font-weight:400;letter-spacing:.02em}
  .tierhead .n{font-size:11px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase}
  .tierhead .rule{flex:1;height:1px;background:var(--line)}
  .tierdesc{font-size:12.5px;color:var(--faint);max-width:64ch;margin:10px 0 0;line-height:1.7}

  h3{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);margin:40px 0 2px;display:flex;align-items:center;gap:12px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  h3 em{font-style:normal;color:var(--faint);font-size:10px;letter-spacing:.1em}

  /* ── tile grid ────────────────────────────────────────────────
     Uniform tiles, not masonry. The old CSS-columns layout reflowed the whole
     column whenever a note expanded on hover — that was the glitchiness.
     Nothing here changes size on hover, ever. */
  .grid{display:grid;gap:10px;margin-top:18px;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  @media(max-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}}

  .card{position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:2px;
    transition:border-color .15s}
  .card:hover{border-color:var(--muted)}
  .card.starred{border-color:var(--star);border-width:2px}
  .card.rejected{opacity:.28}
  .card.rejected:hover{opacity:.85}
  .card.wild{border-color:#3d4f6b}

  .shot{position:absolute;inset:0}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(20px,1fr));height:100%}
  .sw div{height:100%}

  /* everything textual sits over the image and only appears on hover */
  .meta{position:absolute;inset:auto 0 0 0;padding:26px 10px 9px;
    background:linear-gradient(transparent,rgba(0,0,0,.94) 45%);
    opacity:0;transition:opacity .15s;pointer-events:none}
  .card:hover .meta{opacity:1}
  .ttl{font-size:12.5px;line-height:1.25;margin:0 0 2px}
  .by{font-size:9.5px;color:var(--muted)}
  .kicker{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin-top:5px}
  .kicker b{color:var(--accent);font-weight:400}

  /* persistent status marks — always visible so the board reads at a glance */
  .marks{position:absolute;top:0;left:0;right:0;display:flex;gap:4px;
    padding:7px 8px;pointer-events:none;font-size:10px;letter-spacing:.04em}
  .pill{background:rgba(0,0,0,.72);border-radius:2px;padding:2px 6px;backdrop-filter:blur(3px)}
  .pill.k{color:var(--star)} .pill.c{color:var(--accent)} .pill.p{color:#9fb6d4}
  .pill.w{color:#7f9dc4}
  .scr{margin-left:auto;color:var(--muted)}

  /* quick keep/cut without opening anything */
  .quick{position:absolute;right:6px;bottom:6px;display:flex;gap:3px;
    opacity:0;transition:opacity .15s}
  .card:hover .quick{opacity:1}
  .qb{width:26px;height:26px;border:none;border-radius:2px;cursor:pointer;
    background:rgba(0,0,0,.75);color:#ddd;font-size:13px;line-height:1;padding:0;
    display:flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:0}
  .qb:hover{background:#000;color:#fff}
  .qb.on.k{background:var(--star);color:#111}
  .qb.on.c{background:var(--accent);color:#fff}



  /* Free-text "why I kept this". Preset buttons can't carry "the snake is good but
     the type under it is wrong" — this can. Highest-fidelity signal on the board. */

  /* ── detail panel — everything about one find, opened on click ── */
  #lb{position:fixed;inset:0;z-index:100;background:rgba(5,5,4,.96);display:none;
    align-items:center;justify-content:center;padding:28px}
  #lb.on{display:flex}
  .sheet{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);
    gap:0;max-width:1300px;width:100%;max-height:90vh;background:var(--panel);
    border:1px solid var(--line2);border-radius:3px;overflow:hidden}
  @media(max-width:860px){.sheet{grid-template-columns:1fr;max-height:94vh}}
  .sheetimg{background:#000;display:flex;align-items:center;justify-content:center;min-height:0}
  .sheetimg img{max-width:100%;max-height:90vh;object-fit:contain;display:block}
  .sheetimg .sw{width:100%;height:340px}
  .side{padding:26px 26px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  .side h4{margin:0;font-size:20px;font-weight:400;line-height:1.25}
  .side .by2{font-size:12px;color:var(--muted);margin-top:-8px}
  .side .body{font-size:13px;line-height:1.7;color:var(--muted)}
  .side .hexrow{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);
    line-height:1.9;letter-spacing:.03em}
  .tagrow{display:flex;flex-wrap:wrap;gap:5px}
  .tg{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    border:1px solid var(--line2);border-radius:2px;padding:3px 7px}
  .tg.t{color:var(--accent);border-color:rgba(237,31,36,.42)}
  .bigbtns{display:flex;gap:8px;margin-top:2px}
  .bb{flex:1;padding:11px;border:1px solid var(--line2);border-radius:2px;cursor:pointer;
    background:transparent;color:var(--ink);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
  .bb.k.on{background:var(--star);border-color:var(--star);color:#111}
  .bb.c.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .bb:hover{border-color:var(--muted)}
  .why{display:none;flex-wrap:wrap;gap:5px}
  .why.open{display:flex}
  .rc{font-size:10.5px;padding:5px 9px;border:1px solid var(--line2);border-radius:2px;
    color:var(--muted);cursor:pointer;user-select:none}
  .rc:hover{border-color:var(--accent);color:var(--accent)}
  .rc.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .notebox{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line2);
    border-radius:2px;padding:11px;font:13px/1.6 inherit;resize:vertical;min-height:92px}
  .notebox:focus{outline:none;border-color:var(--star)}
  .notebox::placeholder{color:var(--faint)}
  .nlab{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--star)}
  .peernote{font-size:12.5px;line-height:1.6;color:#9fb6d4;font-style:italic;
    border-left:2px solid #3d4f6b;padding-left:11px}
  .srcl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    text-decoration:none;border-bottom:1px solid var(--line2);align-self:flex-start}
  .srcl:hover{color:var(--ink)}
  .xclose{position:fixed;top:16px;right:20px;font-size:24px;color:var(--muted);
    cursor:pointer;z-index:101;line-height:1}
  .xclose:hover{color:var(--ink)}
  .nav{position:fixed;top:50%;transform:translateY(-50%);font-size:30px;color:var(--muted);
    cursor:pointer;z-index:101;padding:14px;user-select:none}
  .nav:hover{color:var(--ink)}
  #prev{left:6px} #next{right:6px}

  #out{width:100%;min-height:230px;margin-top:26px;padding:16px;border-radius:3px;
    border:1px solid var(--line2);background:var(--panel);color:var(--ink);
    font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;display:none}
  .empty{color:var(--faint);padding:70px 0;text-align:center;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 class="serif">Future <span>/</span> Kimonos</h1>
    <div class="run" id="meta"></div>
    <div class="spacer"></div>
    <div class="ctl">
      <select id="who" onchange="setWho()">
        <option value="ladana">Ladana</option>
        <option value="james">James</option>
      </select>
      <span class="stat" id="tally"></span>
      <span class="stat" id="synced"></span>
      <button onclick="saveBlock()">Copy</button>
      <button class="go" onclick="picks()">Export</button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
</header>

<main>
  <p class="lede" id="note"></p>
  <div id="board"></div>
  <textarea id="out" readonly></textarea>
</main>

<div id="lb">
  <span class="xclose" onclick="closeLb()">✕</span>
  <span class="nav" id="prev" onclick="step(-1)">‹</span>
  <span class="nav" id="next" onclick="step(1)">›</span>
  <div class="sheet" id="sheet" onclick="event.stopPropagation()"></div>
</div>

    "note": "A triptych is a back panel. Rider and rearing horse occupy a single horizontal band across the middle third; the top and bottom thirds are empty cream. The cartouche anchors the far left, the seals the far right, and the horse's tail and banner break the frame on both edges. The lesson for a rash guard: let the hero own one band and leave the shoulders and hem genuinely empty — the emptiness is what makes the band read at speed.",
    "img": "https://images.metmuseum.org/CRDImages/as/web-large/DP146816.jpg",

  {

const nKey = w => "fk-notes-v1-" + w;   // free-text "why I kept this"
let stars   = new Set(JSON.parse(localStorage.getItem(sKey(who)) || "[]"));
let rejects = new Map(Object.entries(JSON.parse(localStorage.getItem(rKey(who)) || "{}")));
let notes   = new Map(Object.entries(JSON.parse(localStorage.getItem(nKey(who)) || "{}")));

let fBucket="all", fLane="all", fTerr="all", fTier="all",
    fStar=false, fNew=false, fShowRej=false, fPeer=false, fWild=false;

function readPeer(){
  try { return JSON.parse(localStorage.getItem(pKey(who)) || "null"); }
  catch(e){ return null; }
}
let peer = readPeer();

/* ── The review server ──────────────────────────────────────────────────────
   Stars and rejects save to the internet, so they follow you between devices
   and both reviewers see each other. Empty API_BASE = this browser only. */
const API_BASE = "https://fk-board.ladana.workers.dev";
const kKey = () => "fk-key";
const setStatus = t => { const e = document.getElementById("synced"); if(e) e.textContent = t; };

async function apiGet(){
  if(!API_BASE) return null;
  try{ /* cache-bust: an edge cache served a stale copy during testing even with no-store */
    const r = await fetch(API_BASE + "/reviews?cb=" + Date.now(), {cache:"no-store"});
       return r.ok ? await r.json() : null; }
  catch(e){ return null; }
}
let saveTimer=null;
async function apiSave(){
  if(!API_BASE) return;
  let key = localStorage.getItem(kKey());
  if(!key){
    key = prompt("One-time setup — enter the team passphrase to save your review:");
    if(!key){ setStatus("not saved"); return; }
    localStorage.setItem(kKey(), key);
  }
  setStatus("saving…");
  try{
    const r = await fetch(API_BASE + "/reviews", {
      method:"POST", headers:{"Content-Type":"application/json","X-Board-Key":key},
      body: JSON.stringify({ who, s:[...stars], r:Object.fromEntries(rejects),
                             n:Object.fromEntries(notes) })
    });
    if(r.status === 401){ localStorage.removeItem(kKey());
      setStatus("wrong passphrase — click again"); return; }
    setStatus(r.ok ? "saved " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})
                   : "save failed");
  }catch(e){ setStatus("offline — saved locally"); }
}
/* Only save once the person has clicked something, so the page never asks for the
   passphrase on load. Debounced — twenty stars in a row is one save. */
let userActed = false;
function queueSave(){
  if(!API_BASE || !userActed) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(apiSave, 1200);
}

async function loadSharedReviews(){
  try{
    let arr = await apiGet();
    if(!arr){
      const r = await fetch("reviews.json?cb=" + Date.now(), {cache:"no-store"});
      if(!r.ok) return;
      arr = await r.json();
    }
    if(!Array.isArray(arr)) return;
    const mine  = arr.filter(x => x && x.who === who).pop();
    const other = arr.filter(x => x && x.who && x.who !== who).pop();
    if(other && (!peer || (peer.at || "") <= (other.at || ""))){
      peer = { w:other.who, at:other.at||"", s:other.s||[], r:other.r||{}, n:other.n||{} };
      localStorage.setItem(pKey(who), JSON.stringify(peer));
    }
    /* Restore your own marks only into an empty browser — never overwrite work
       in progress with an older copy. */
    if(mine && stars.size === 0 && rejects.size === 0){
      stars   = new Set(mine.s || []);
      rejects = new Map(Object.entries(mine.r || {}));
      notes   = new Map(Object.entries(mine.n || {}));
      save();
    }
    setStatus(other ? "live · " + peerName() + " " + (other.at||"") : "live");
    render();
  }catch(e){}
}

function ingestShareLink(){
  const m = location.hash.match(/^#r=(.+)$/);
  if(!m) return;
  try{
    const d = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    if(d.w !== "ladana" && d.w !== "james") return;
    const viewer = d.w === "ladana" ? "james" : "ladana";
    localStorage.setItem(pKey(viewer), JSON.stringify({w:d.w,at:d.at||"",s:d.s||[],r:d.r||{}}));
    if(who !== viewer){ who = viewer; localStorage.setItem("fk-who", who); }
    history.replaceState(null,"",location.pathname+location.search);
  }catch(e){}
}
ingestShareLink();
peer = readPeer();

function saveBlock(){
  const p = { who, at:new Date().toISOString().slice(0,10),
              s:[...stars], r:Object.fromEntries(rejects), n:Object.fromEntries(notes) };
  const enc = encodeURIComponent(btoa(unescape(encodeURIComponent(
    JSON.stringify({w:who,at:p.at,s:p.s,r:p.r})))));
  const o = document.getElementById("out");
  o.style.display="block";
  o.value = "MY REVIEW — " + (who==="ladana"?"Ladana":"James") + ", " + p.at + "\n" +
    stars.size + " kept · " + rejects.size + " rejected.\n\n" +
    "Saved to the server automatically. This box is only needed if you want to send\n" +
    "it somewhere by hand.\n\n" + JSON.stringify(p) + "\n\n" +
    location.origin + location.pathname + "#r=" + enc + "\n";
  o.select();
  try{ navigator.clipboard.writeText(o.value); }catch(e){}
}

const WINDOW = (window.BOARD_META && BOARD_META.windowDays) || 30;
const today = new Date();
const ageDays = d => { const t = Date.parse(d); return isNaN(t) ? 999 : Math.floor((today-t)/86400000); };
const otherWho = () => who === "ladana" ? "james" : "ladana";

/* Rolling window: unstarred finds age out. Anything either reviewer starred stays
   for good — keepers are the point. Rejects are never deleted; they are the signal. */
function inWindow(f){
  if(stars.has(f.id)) return true;
  const o = new Set(JSON.parse(localStorage.getItem(sKey(otherWho())) || "[]"));
  if(o.has(f.id)) return true;
  if(peer && peer.s && peer.s.includes(f.id)) return true;
  return ageDays(f.firstSeen) <= WINDOW;
}
const peerName = () => peer ? (peer.w === "ladana" ? "Ladana" : "James") : "";
const peerStarred  = id => !!(peer && peer.s && peer.s.includes(id));
const peerRejected = id => !!(peer && peer.r && peer.r[id]);
const tierOf = f => f.tier === "sweep" ? "sweep" : "curated";

document.getElementById("who").value = who;
document.getElementById("meta").textContent = BOARD_META.runLabel || BOARD_META.updated || "";
document.getElementById("note").textContent = BOARD_META.note || "";

function setWho(){
  who = document.getElementById("who").value;
  localStorage.setItem("fk-who", who);
  stars   = new Set(JSON.parse(localStorage.getItem(sKey(who)) || "[]"));
  rejects = new Map(Object.entries(localStorage.getItem(rKey(who)) ? JSON.parse(localStorage.getItem(rKey(who))) : {}));
  notes   = new Map(Object.entries(JSON.parse(localStorage.getItem(nKey(who)) || "{}")));
  peer    = readPeer();
  save(); render(); loadSharedReviews();
}
function save(){
  localStorage.setItem(sKey(who), JSON.stringify([...stars]));
  localStorage.setItem(rKey(who), JSON.stringify(Object.fromEntries(rejects)));
  localStorage.setItem(nKey(who), JSON.stringify(Object.fromEntries(notes)));
  document.getElementById("tally").innerHTML =
    "<b>" + stars.size + "</b> kept · <b>" + rejects.size + "</b> cut";
  queueSave();
}
/* Marking a card repaints only that card. Re-rendering all 27 on every click made
   open reason lists snap shut and the scroll position jump. */
function refreshCard(id){
  const f = FINDS.find(x => x.id === id);
  const el = document.querySelector('.card[data-id="'+id+'"]');
  if(!f || !el) { render(); return; }
  const tmp = document.createElement("div");
  tmp.innerHTML = cardHTML(f);
  const fresh = tmp.firstChild;
  el.replaceWith(fresh);
  wire(fresh, f);
  buildFilters();                       // counts change even when the grid doesn't
  /* A card filtered out by the current view should vanish rather than linger. */
  if(!visible().some(x => x.id === id)) fresh.remove();
}
function toggleStar(id){
  userActed = true;
  if(stars.has(id)){ stars.delete(id); notes.delete(id); }   // un-keeping drops the note
  else { stars.add(id); rejects.delete(id); }
  save(); refreshCard(id);
}
function setReject(id, reason){
  userActed = true;
  if(rejects.get(id) === reason) rejects.delete(id);
  else { rejects.set(id, reason); stars.delete(id); }
  save(); refreshCard(id);
}
function clearReject(id){ userActed = true; rejects.delete(id); save(); refreshCard(id); }

function openLb(src, cap){
  document.getElementById("lbi").src = src;
  document.getElementById("lbc").textContent = cap;
  document.getElementById("lb").classList.add("on");
}
function closeLb(){ document.getElementById("lb").classList.remove("on"); }
document.addEventListener("keydown", e => { if(e.key === "Escape") closeLb(); });

function chip(val,on,kind,label,red){
  return '<span class="chip'+(on?" on":"")+(red?" red":"")+'" data-kind="'+kind+
         '" data-val="'+val+'">'+label+'</span>';
}
function buildFilters(){
  const el = document.getElementById("filters");
  const live = FINDS.filter(inWindow);
  const c = (k) => live.reduce((a,f)=>{const v=k(f); if(v)a[v]=(a[v]||0)+1; return a;},{});
  const terrC = c(f=>f.territory), bucketC = c(f=>f.bucket), laneC = c(f=>f.lane);
  const nSweep = live.filter(f=>tierOf(f)==="sweep").length;

  let h = '<span class="flab">Show</span>';
  h += chip("all", fTier==="all","tier","Everything "+live.length);
  if(nSweep < live.length) h += chip("curated", fTier==="curated","tier","Curated "+(live.length-nSweep));
  if(nSweep) h += chip("sweep", fTier==="sweep","tier","Sweep "+nSweep);
  h += chip("star", fStar,"flag","★ Kept "+stars.size);
  if(peer) h += chip("peer", fPeer,"flag","★ "+peerName()+" "+((peer.s||[]).length));
  h += chip("rej", fShowRej,"flag","Cut "+rejects.size, true);
  const nWild = live.filter(f=>f.wildcard).length;
  if(nWild) h += chip("wild", fWild,"flag","◇ Wildcards "+nWild);
  h += chip("new", fNew,"flag","New");
  h += '<span class="brk"></span><span class="flab">Territory</span>';
  h += chip("all", fTerr==="all","terr","All");
  Object.keys(TERR).forEach(t => { if(terrC[t]) h += chip(t, fTerr===t,"terr",TERR[t]+" "+terrC[t]); });
  h += '<span class="brk"></span><span class="flab">Ingredient</span>';
  h += chip("all", fBucket==="all","bucket","All");
  Object.keys(NAMES).forEach(b => { if(bucketC[b]) h += chip(b, fBucket===b,"bucket",NAMES[b]+" "+bucketC[b]); });
  h += '<span class="brk"></span><span class="flab">Source</span>';
  h += chip("all", fLane==="all","lane","All");
  Object.keys(LANES).forEach(l => { if(laneC[l]) h += chip(l, fLane===l,"lane",LANES[l]+" "+laneC[l]); });

  el.innerHTML = h;
  el.querySelectorAll(".chip").forEach(x => x.onclick = () => {
    const k = x.dataset.kind, v = x.dataset.val;
    if(k==="terr") fTerr=v; else if(k==="bucket") fBucket=v;
    else if(k==="lane") fLane=v; else if(k==="tier") fTier=v;
    else if(v==="star") fStar=!fStar; else if(v==="new") fNew=!fNew;
    else if(v==="rej") fShowRej=!fShowRej; else if(v==="peer") fPeer=!fPeer;
    else if(v==="wild") fWild=!fWild;
    render();
  });
}

function visible(){
  return FINDS.filter(inWindow)
    .filter(f => fShowRej ? true : !rejects.has(f.id))
    .filter(f => fTier==="all" || tierOf(f)===fTier)
    .filter(f => fTerr==="all" || f.territory===fTerr)
    .filter(f => fBucket==="all" || f.bucket===fBucket)
    .filter(f => fLane==="all" || f.lane===fLane)
    .filter(f => !fStar || stars.has(f.id))
    .filter(f => !fPeer || peerStarred(f.id))
    .filter(f => !fWild || f.wildcard)
    .filter(f => !fNew || ageDays(f.firstSeen) <= 7);
}

function esc(t){ return String(t==null?"":t)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* A tile is image-only. Everything else lives in the detail panel, so nothing on
   the board ever changes size and the grid never reflows. */
function cardHTML(f){
  const isRej = rejects.has(f.id), isStar = stars.has(f.id);
  const visual = f.swatches
    ? '<div class="sw">'+f.swatches.map(x=>'<div style="background:'+x+'"></div>').join("")+'</div>'
    : '<img loading="lazy" alt="'+esc(f.title)+'" src="'+f.img+'" onerror="this.closest(\'.card\').style.display=\'none\'">';
  const marks = [
    isStar ? '<span class="pill k">★</span>' : '',
    isRej  ? '<span class="pill c">✕ '+esc(REASONS[rejects.get(f.id)]||"")+'</span>' : '',
    peerStarred(f.id)  ? '<span class="pill p">★ '+esc(peerName())+'</span>' : '',
    peerRejected(f.id) ? '<span class="pill p">✕ '+esc(peerName())+'</span>' : '',
    f.wildcard ? '<span class="pill w">◇</span>' : '',
    f.score!=null ? '<span class="pill scr">'+f.score+'</span>' : ''
  ].join("");
  return '<div class="card'+(isStar?" starred":"")+(isRej?" rejected":"")
    + (f.wildcard?" wild":"")+'" data-id="'+f.id+'">'
    + '<div class="shot">'+visual+'</div>'
    + '<div class="marks">'+marks+'</div>'
    + '<div class="meta"><div class="ttl serif">'+esc(f.title)+'</div>'
    +   '<div class="by">'+esc(f.brand)+'</div>'
    +   '<div class="kicker"><b>'+esc(TERR[f.territory]||"—")+'</b> · '+esc(NAMES[f.bucket]||f.bucket)+'</div></div>'
    + '<div class="quick">'
    +   '<button class="qb k'+(isStar?" on":"")+'" title="Keep">'+(isStar?"★":"☆")+'</button>'
    +   '<button class="qb c'+(isRej?" on":"")+'" title="Cut">✕</button>'
    + '</div></div>';
}

function wire(el, f){
  if(!el) return;
  const k = el.querySelector(".qb.k");
  if(k) k.onclick = e => { e.stopPropagation(); toggleStar(f.id); };
  const c = el.querySelector(".qb.c");
  if(c) c.onclick = e => {
    e.stopPropagation();
    if(rejects.has(f.id)) clearReject(f.id); else openDetail(f.id);
  };
  el.onclick = () => openDetail(f.id);
}

/* ── detail panel ─────────────────────────────────────────────────────── */
let curId = null;
function openDetail(id){
  curId = id;
  const f = FINDS.find(x => x.id === id);
  if(!f) return;
  const isRej = rejects.has(f.id), isStar = stars.has(f.id);
  const visual = f.swatches
    ? '<div class="sw">'+f.swatches.map(x=>'<div style="background:'+x+'"></div>').join("")+'</div>'
    : '<img src="'+f.img+'" alt="'+esc(f.title)+'">';
  const hex = f.swatches
    ? '<div class="hexrow">'+f.swatches.map((x,i)=>(f.swatchNames?esc(f.swatchNames[i])+" ":"")+x).join("<br>")+'</div>' : '';
  const tags = '<div class="tagrow">'
    + '<span class="tg t">'+esc(TERR[f.territory]||f.territory||"—")+'</span>'
    + '<span class="tg">'+esc(NAMES[f.bucket]||f.bucket)+'</span>'
    + '<span class="tg">'+esc(LANES[f.lane]||f.lane)+'</span>'
    + (f.score!=null?'<span class="tg">'+f.score+'/6</span>':'')
    + '<span class="tg">'+esc(tierOf(f))+'</span>'
    + (f.wildcard?'<span class="tg">◇ wildcard</span>':'')
    + (f.tags||[]).map(t=>'<span class="tg">'+esc(t)+'</span>').join("")
    + '</div>';
  const pN = peer && peer.n && peer.n[f.id];
  const peerBits =
    (peerStarred(f.id)  ? '<div class="nlab">★ '+esc(peerName())+' kept this</div>' : '') +
    (peerRejected(f.id) ? '<div class="nlab" style="color:var(--accent)">✕ '+esc(peerName())+' — '+esc(REASONS[peer.r[f.id]]||"")+'</div>' : '') +
    (pN ? '<div class="peernote">'+esc(pN)+'</div>' : '');
  const reasons = Object.keys(REASONS).map(r =>
    '<span class="rc'+(rejects.get(f.id)===r?" on":"")+'" data-r="'+r+'">'+REASONS[r]+'</span>').join("");

  document.getElementById("sheet").innerHTML =
      '<div class="sheetimg">'+visual+'</div>'
    + '<div class="side">'
    +   '<h4 class="serif">'+esc(f.title)+'</h4>'
    +   '<div class="by2">'+esc(f.brand)+'</div>'
    +   tags + hex
    +   '<div class="body">'+esc(f.note)+'</div>'
    +   peerBits
    +   '<div class="bigbtns">'
    +     '<button class="bb k'+(isStar?" on":"")+'" id="dk">'+(isStar?"★ Kept":"☆ Keep")+'</button>'
    +     '<button class="bb c'+(isRej?" on":"")+'" id="dc">'+(isRej?"✕ Cut":"Cut")+'</button>'
    +   '</div>'
    +   '<div class="why'+(isRej||!isStar?"":"")+(isRej?" open":"")+'" id="dwhy">'+reasons+'</div>'
    +   (isStar ? '<div class="nlab">Why did you keep it?</div>'
    +     '<textarea class="notebox" id="dnote" placeholder="Type freely — one element is enough. e.g. the palette only, or the type but not the graphic.">'
    +     esc(notes.get(f.id)||"")+'</textarea>' : '')
    +   '<a class="srcl" href="'+f.source+'" target="_blank" rel="noopener">view source ↗</a>'
    + '</div>';

  const dk = document.getElementById("dk");
  if(dk) dk.onclick = () => { toggleStar(f.id); openDetail(f.id); };
  const dc = document.getElementById("dc");
  if(dc) dc.onclick = () => {
    if(rejects.has(f.id)){ clearReject(f.id); openDetail(f.id); }
    else document.getElementById("dwhy").classList.toggle("open");
  };
  document.querySelectorAll("#dwhy .rc").forEach(x =>
    x.onclick = () => { setReject(f.id, x.dataset.r); openDetail(f.id); });
  const nb = document.getElementById("dnote");
  if(nb) nb.onblur = () => {
    const v = nb.value.trim(), had = notes.get(f.id) || "";
    if(v === had) return;
    userActed = true;
    if(v) notes.set(f.id, v); else notes.delete(f.id);
    save();
  };
  document.getElementById("lb").classList.add("on");
}
function closeLb(){
  const nb = document.getElementById("dnote");
  if(nb) nb.blur();                       // commit an in-progress note before closing
  document.getElementById("lb").classList.remove("on");
  curId = null;
}
/* arrow through the board without closing */
function step(d){
  const list = visible();
  const i = list.findIndex(f => f.id === curId);
  if(i === -1) return;
  const n = list[(i + d + list.length) % list.length];
  if(n) openDetail(n.id);
}
document.addEventListener("keydown", e => {
  if(!document.getElementById("lb").classList.contains("on")) return;
  if(e.target && e.target.tagName === "TEXTAREA") return;
  if(e.key === "Escape") closeLb();
  if(e.key === "ArrowRight") step(1);
  if(e.key === "ArrowLeft") step(-1);
  if(e.key === "s"){ toggleStar(curId); openDetail(curId); }
});
document.getElementById("lb").onclick = e => { if(e.target.id === "lb") closeLb(); };

function render(){
  buildFilters();
  const list = visible();
  const root = document.getElementById("board");
  root.innerHTML = "";
  if(!list.length){ root.innerHTML = '<p class="empty">Nothing matches these filters.</p>'; return; }

  /* Group by tier, then by ingredient — the two-level split is what makes a long
     board scannable instead of one undifferentiated wall. */
  /* One masonry per tier, NOT per ingredient. Most ingredient buckets hold only one
     or two finds, so a grid each collapsed to a single column and wasted the page.
     Ingredient stays as a label on the card and as a filter chip. */
  ["curated","sweep"].forEach(tier => {
    const inTier = list.filter(f => tierOf(f) === tier);
    if(!inTier.length) return;
    /* Order by ingredient so related finds still sit together in the flow. */
    const order = Object.keys(NAMES);
    inTier.sort((a,b) => order.indexOf(a.bucket) - order.indexOf(b.bucket));
    const sec = document.createElement("section");
    sec.className = "tier";
    sec.innerHTML =
      '<div class="tierhead"><h2 class="serif">'+TIERS[tier].label+'</h2>'
      + '<span class="n">'+inTier.length+' find'+(inTier.length===1?"":"s")+'</span>'
      + '<span class="rule"></span></div>'
      + '<p class="tierdesc">'+TIERS[tier].desc+'</p>'
      + '<div class="grid">'+inTier.map(cardHTML).join("")+'</div>';
    root.appendChild(sec);
    inTier.forEach(f => wire(sec.querySelector('[data-id="'+f.id+'"]'), f));
  });
}

function lineFor(f){
  let t = "\n- **" + f.title + "** — " + f.brand + "  \n";
  t += "  id: " + f.id + " | lane: " + (LANES[f.lane]||f.lane) +
       " | territory: " + (TERR[f.territory]||f.territory||"—") +
       " | class: " + (f.class||"—") + " | tier: " + tierOf(f) +
       (f.score!=null ? " | score: "+f.score+"/6" : "") + " | first seen: " + f.firstSeen + "\n";
  if(f.swatches) t += "  palette: " + f.swatches.map((s,i)=>(f.swatchNames?f.swatchNames[i]+" ":"")+s).join(", ") + "\n";
  t += "  ingredient: " + f.note + "\n";
  if(f.tags && f.tags.length) t += "  tags: " + f.tags.join(", ") + "\n";
  t += "  source: " + f.source + "\n";
  if(f.img) t += "  image: " + f.img + "\n";
  if(notes.get(f.id))    t += "  WHY I KEPT IT: " + notes.get(f.id) + "\n";
  if(peerStarred(f.id))  t += "  " + peerName() + ": KEPT\n";
  if(peer && peer.n && peer.n[f.id]) t += "  " + peerName() + " SAYS: " + peer.n[f.id] + "\n";
  if(peerRejected(f.id)) t += "  " + peerName() + ": REJECTED — " + (REASONS[peer.r[f.id]]||peer.r[f.id]) + "\n";
  return t;
}

function picks(){
  const kept = FINDS.filter(f => stars.has(f.id));
  const rej  = FINDS.filter(f => rejects.has(f.id));
  const name = who === "ladana" ? "Ladana" : "James";
  let txt = "# Board review — " + name + " — " + new Date().toISOString().slice(0,10) +
            "\n\n" + kept.length + " kept · " + rej.length + " rejected.\n";
  if(peer){
    const both  = kept.filter(f => peerStarred(f.id)).map(f=>f.id);
    const split = kept.filter(f => peerRejected(f.id)).map(f=>f.id);
    txt += "\nIncludes " + peerName() + "'s review from " + (peer.at||"earlier") + ".\n";
    if(both.length)  txt += "Both kept: " + both.join(", ") + "\n";
    if(split.length) txt += "Disagreed (" + name + " kept, " + peerName() + " cut): " + split.join(", ") + "\n";
  }
  txt += "\n\n# KEEP\n";
  if(!kept.length) txt += "\nNothing kept.\n";
  else Object.keys(NAMES).forEach(b => {
    const items = kept.filter(f => f.bucket === b);
    if(!items.length) return;
    txt += "\n## " + NAMES[b] + "\n";
    items.forEach(f => txt += lineFor(f));
  });
  txt += "\n\n# REJECT\n";
  if(!rej.length) txt += "\nNothing rejected.\n";
  else Object.keys(REASONS).forEach(r => {
    const items = rej.filter(f => rejects.get(f.id) === r);
    if(!items.length) return;
    txt += "\n## " + REASONS[r] + "  (" + items.length + ")\n";
    items.forEach(f => txt += lineFor(f));
  });
  txt += "\n---\nPaste this to Claude. Keeps become keeper cards and direction sheets; " +
         "rejects are logged and any reason used three times becomes a permanent filter.\n";
  const o = document.getElementById("out");
  o.style.display="block"; o.value = txt; o.select();
  try{ navigator.clipboard.writeText(txt); }catch(e){}
}

render(); save(); loadSharedReviews();
</script>
</body>
</html>
