<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future Kimonos — Inspiration Board</title>
<style>
  :root{
    --bg:#faf9f7; --card:#fff; --ink:#1a1a18; --muted:#6b6a65;
    --line:#e3e1db; --star:#c9a227; --accent:#1a1a18; --new:#ED1F24;
    --rej:#b4413a; --ref:#5b6f8c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141413; --card:#1e1e1c; --ink:#f2f1ee; --muted:#9a9892;
           --line:#33322f; --star:#e0b93a; --accent:#f2f1ee; --new:#ff4b50;
           --rej:#e0615a; --ref:#8ba3c4; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  header{position:sticky;top:0;z-index:10;background:var(--bg);
    border-bottom:1px solid var(--line);padding:16px 28px 12px;}
  .hrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  h1{font-size:19px;font-weight:500;margin:0;}
  .meta{font-size:13px;color:var(--muted);}
  .spacer{flex:1}
  button{font:inherit;font-size:13px;padding:7px 14px;border-radius:7px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;}
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  select{font:inherit;font-size:13px;padding:6px 10px;border-radius:7px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);}
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;align-items:center}
  .chip{font-size:12px;padding:4px 11px;border-radius:20px;background:var(--card);
    border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--muted)}
  .chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .flabel{font-size:12px;color:var(--muted);margin-right:2px}
  main{padding:28px;max-width:1400px;margin:0 auto;}
  .note{font-size:13px;color:var(--muted);margin:0 0 28px;max-width:74ch;}
  h2{font-size:15px;font-weight:500;margin:34px 0 4px;}
  .bcount{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,opacity .15s;position:relative}
  .card.starred{border-color:var(--star);border-width:2px;}
  .card.rejected{border-color:var(--rej);opacity:.42}
  .card.rejected:hover{opacity:.9}
  .badge{position:absolute;top:9px;left:9px;font-size:10px;letter-spacing:.04em;
    text-transform:uppercase;padding:3px 8px;border-radius:20px;
    background:rgba(0,0,0,.62);color:#fff;backdrop-filter:blur(4px)}
  .cls{position:absolute;top:9px;left:9px;font-size:10px;letter-spacing:.04em;
    text-transform:uppercase;padding:3px 8px;border-radius:20px;color:#fff;backdrop-filter:blur(4px)}
  .terr{position:absolute;top:34px;left:9px;font-size:10px;letter-spacing:.04em;
    padding:3px 8px;border-radius:20px;background:rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(4px)}
  .newdot{position:absolute;top:9px;right:9px;font-size:10px;letter-spacing:.04em;
    text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--new);color:#fff}
  .scr{position:absolute;bottom:9px;right:9px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:2px 7px;border-radius:20px;background:rgba(0,0,0,.62);color:#fff}
  .vwrap{position:relative}
  .thumb{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg);}
  .sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(40px,1fr));aspect-ratio:2/1;}
  .sw div{width:100%;height:100%}
  .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .t{font-size:14px;font-weight:500;line-height:1.35}
  .b{font-size:12px;color:var(--muted)}
  .n{font-size:13px;color:var(--ink);opacity:.85}
  .hex{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .tag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--bg);
    border:1px solid var(--line);color:var(--muted)}
  .foot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
  .star{background:none;border:none;padding:0;font-size:19px;line-height:1;
    color:var(--line);cursor:pointer;transition:color .15s}
  .star.on{color:var(--star)}
  .rej{background:none;border:none;padding:0;font-size:15px;line-height:1;
    color:var(--line);cursor:pointer;transition:color .15s}
  .rej:hover{color:var(--rej)}
  .rej.on{color:var(--rej)}
  .seen{font-size:11px;color:var(--muted);margin-left:auto}
  .why{display:none;flex-wrap:wrap;gap:5px;padding:10px 14px;border-top:1px solid var(--line);
    background:var(--bg)}
  .why.open{display:flex}
  .rc{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--card);
    border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none}
  .rc:hover{border-color:var(--rej);color:var(--rej)}
  .rc.on{background:var(--rej);border-color:var(--rej);color:#fff}
  .rlabel{font-size:11px;color:var(--rej);padding:8px 14px 0;font-style:italic}
  .peer{display:block;font-size:11px;padding:6px 14px 0;letter-spacing:.01em}
  .peer.star{color:var(--star)}
  .peer.rejd{color:var(--rej)}
  .agree{position:absolute;bottom:9px;left:9px;font-size:10px;letter-spacing:.04em;
    text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--star);color:#141413}
  a{color:var(--muted);font-size:12px;text-decoration:none;border-bottom:1px solid var(--line)}
  a:hover{color:var(--ink)}
  #out{width:100%;min-height:260px;margin-top:20px;padding:14px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;display:none}
  .empty{font-size:13px;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <h1>Inspiration board</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="spacer"></div>
    <span class="meta">Reviewing as</span>
    <select id="who" onchange="setWho()">
      <option value="ladana">Ladana</option>
      <option value="james">James</option>
    </select>
    <span class="meta" id="tally">0 starred · 0 rejected</span>
    <span class="meta" id="synced"></span>
    <button onclick="saveBlock()">Save my review</button>
    <button class="primary" onclick="picks()">Export review</button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main>
  <p class="note" id="note"></p>
  <div id="board"></div>
  <textarea id="out" readonly></textarea>
</main>
<script src="finds.js"></script>
<script>
const NAMES = {
  "01-colour-palette":"Colour palette","02-font-type":"Font and type","03-pattern":"Pattern",
  "04-light-dark-placement":"Light and dark placement","05-mood":"Mood","06-garment-layout":"Garment layout",
  "07-theme":"Theme","08-standout-graphic":"Standout graphic","09-gradient-shape":"Gradients and shapes",
  "10-graphics-pack":"Graphics pack and templates"
};
const LANES = {
  "moto-mtb":"Moto / MTB / BMX", "cycling-tri":"Cycling / tri / running",
  "football-teamwear":"Football / rugby / esports", "combat":"Combat sports",
  "athlete":"Athletes", "bjj":"BJJ", "reference":"Reference artwork", "inbox":"Inbox"
};
const TERR = {
  "neo-japanese":"Neo-Japanese / Bushido",
  "cyberpunk-tech":"Cyberpunk / Neo Tokyo",
  "luxury-streetwear":"Streetwear graphics",
  "printmaking-remix":"Printmaking remix",
  "motorsport-graphics":"Motorsport graphics",
  "editorial-composition":"Editorial / minimalism"
};
/* Reject reasons. Keep this list short and mutually exclusive — the whole point is that
   the collector can act on them. Adding a reason means adding a rule it can apply. */
const REASONS = {
  "plain":"Too plain",
  "busy":"Too busy / no hierarchy",
  "cheap":"Looks cheap / flat vector",
  "generic":"Generic — seen everywhere",
  "process":"Wrong process — not sublimated",
  "womens":"Women's product",
  "recolour":"Recolour, not a new design",
  "offbrand":"Off-brand for FK",
  "type":"Bad type",
  "quality":"Image too poor to judge"
};

let who = localStorage.getItem("fk-who") || "ladana";
const sKey = w => "fk-stars-v2-" + w;
const rKey = w => "fk-rejects-v1-" + w;
const pKey = w => "fk-peer-v1-" + w;   // the OTHER person's review, received via share link
let stars   = new Set(JSON.parse(localStorage.getItem(sKey(who)) || "[]"));
let rejects = new Map(Object.entries(JSON.parse(localStorage.getItem(rKey(who)) || "{}")));

let fBucket = "all", fLane = "all", fTerr = "all", fStar = false, fNew = false,
    fShowRej = false, fPeer = false, fTier = "all";

/* ── Cross-device review sharing ────────────────────────────────────────────
   localStorage is per-browser, so Ladana and James can never see each other's
   marks on a static page. There is no backend and a GitHub Pages site cannot
   write anywhere, so the review travels in the URL instead:

     James reviews → "Share my review" → link with his marks encoded in the hash
     → Ladana opens it → his marks merge into her board as peer marks.

   Peer marks are read-only. They never overwrite your own stars or rejects. */
function readPeer(){
  try { return JSON.parse(localStorage.getItem(pKey(who)) || "null"); }
  catch(e){ return null; }
}
let peer = readPeer();

/* Shared reviews, fetched from the repo on load.
   reviews.json holds one entry per reviewer, newest wins:
     [ { "who":"james", "at":"2026-08-07", "s":[ids], "r":{id:reason} }, ... ]
   This is what makes the board shared rather than per-browser. Writing back is
   a commit — the export block below is the payload. */
/* ── The review server ──────────────────────────────────────────────────────
   Set API_BASE and stars/rejects save to the internet, so they follow you
   between laptop and phone and both reviewers see each other live.
   Leave it empty and the board still works, saving to this browser only. */
const API_BASE = "https://fk-board.ladana.workers.dev";   // e.g. "https://fk-board.<subdomain>.workers.dev"

const kKey = () => "fk-key";
const setStatus = t => { const e = document.getElementById("synced"); if(e) e.textContent = t; };

async function apiGet(){
  if(!API_BASE) return null;
  try{
    const r = await fetch(API_BASE + "/reviews", {cache:"no-store"});
    return r.ok ? await r.json() : null;
  }catch(e){ return null; }
}

let saveTimer = null, saveQueued = false;
async function apiSave(){
  if(!API_BASE) return;
  let key = localStorage.getItem(kKey());
  if(!key){
    key = prompt("One-time setup — enter the team passphrase to save your review:");
    if(!key) { setStatus("not saved — no passphrase"); return; }
    localStorage.setItem(kKey(), key);
  }
  setStatus("saving…");
  try{
    const r = await fetch(API_BASE + "/reviews", {
      method:"POST",
      headers:{"Content-Type":"application/json","X-Board-Key":key},
      body: JSON.stringify({ who, s:[...stars], r:Object.fromEntries(rejects) })
    });
    if(r.status === 401){
      localStorage.removeItem(kKey());
      setStatus("wrong passphrase — click a star to try again");
      return;
    }
    setStatus(r.ok ? "saved " + new Date().toLocaleTimeString() : "save failed");
  }catch(e){ setStatus("offline — saved in this browser only"); }
}
/* Only save after the person has actually clicked something. Without this the
   page would ask for the passphrase on load, before anyone had marked anything. */
let userActed = false;
/* Debounced: clicking twenty stars in a row is one save, not twenty. */
function queueSave(){
  if(!API_BASE || !userActed) return;
  saveQueued = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveQueued = false; apiSave(); }, 1200);
}

async function loadSharedReviews(){
  try{
    let arr = await apiGet();
    if(!arr){
      const r = await fetch("reviews.json?cb=" + Date.now(), {cache:"no-store"});
      if(!r.ok) return;
      arr = await r.json();
    }
    if(!Array.isArray(arr)) return;
    const mine  = arr.filter(x => x && x.who === who).pop();
    const other = arr.filter(x => x && x.who && x.who !== who).pop();
    /* Their marks become peer marks unless a newer share link is already stored. */
    if(other && (!peer || (peer.at || "") <= (other.at || ""))){
      peer = { w: other.who, at: other.at || "", s: other.s || [], r: other.r || {} };
      localStorage.setItem(pKey(who), JSON.stringify(peer));
    }
    /* Your own marks are restored only if this browser has none — never overwrite
       work in progress with an older commit. */
    if(mine && stars.size === 0 && rejects.size === 0){
      stars   = new Set(mine.s || []);
      rejects = new Map(Object.entries(mine.r || {}));
      save();
    }
    setStatus(other
      ? (API_BASE ? "live · " : "synced · ") +
        (other.who === "ladana" ? "Ladana" : "James") + "'s review from " + (other.at || "?")
      : (API_BASE ? "live · no review from the other reviewer yet"
                  : "synced · no review from the other reviewer yet"));
    render();
  }catch(e){ /* running from a local file, or no reviews.json yet — fine */ }
}

function ingestShareLink(){
  const m = location.hash.match(/^#r=(.+)$/);
  if(!m) return;
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    if(!data.w || (data.w !== "ladana" && data.w !== "james")) return;
    /* Store it under whichever reviewer is NOT the sender, so it shows up as
       "their" marks no matter who opens the link. */
    const viewer = data.w === "ladana" ? "james" : "ladana";
    localStorage.setItem(pKey(viewer), JSON.stringify({
      w: data.w, at: data.at || "", s: data.s || [], r: data.r || {}
    }));
    if(who !== viewer){ who = viewer; localStorage.setItem("fk-who", who); }
    history.replaceState(null, "", location.pathname + location.search);
    setTimeout(() => alert(
      (data.w === "ladana" ? "Ladana" : "James") + "'s review loaded — " +
      (data.s || []).length + " kept, " + Object.keys(data.r || {}).length + " rejected.\n\n" +
      "Their marks show as a badge on each card. Yours are untouched."), 60);
  } catch(e){ console.warn("Could not read share link", e); }
}
ingestShareLink();
peer = readPeer();

/* "Save my review" — produces the JSON line for reviews.json plus a share link.
   Send either back to Claude, or paste the JSON straight into the repo file. */
function saveBlock(){
  const payload = { who, at: new Date().toISOString().slice(0,10),
                    s: [...stars], r: Object.fromEntries(rejects) };
  const enc = encodeURIComponent(btoa(unescape(encodeURIComponent(
    JSON.stringify({ w: who, at: payload.at, s: payload.s, r: payload.r })))));
  const o = document.getElementById("out");
  o.style.display = "block";
  o.value =
    "MY REVIEW — " + (who === "ladana" ? "Ladana" : "James") + ", " + payload.at + "\n" +
    stars.size + " kept · " + rejects.size + " rejected.\n\n" +
    "Send this whole box to Claude and it goes into the shared board.\n\n" +
    "--- reviews.json entry ---\n" +
    JSON.stringify(payload) + "\n\n" +
    "--- or open this link to merge into someone else's board ---\n" +
    location.origin + location.pathname + "#r=" + enc + "\n";
  o.select();
  try { navigator.clipboard.writeText(o.value); } catch(e){}
}

function shareLink(){
  const payload = { w: who, at: new Date().toISOString().slice(0,10),
                    s: [...stars], r: Object.fromEntries(rejects) };
  const enc = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
  const url = location.origin + location.pathname + "#r=" + enc;
  const o = document.getElementById("out");
  o.style.display = "block";
  o.value = "Send this link to " + (who === "ladana" ? "James" : "Ladana") +
    ". Opening it merges your review into their board.\n\n" + url +
    "\n\n(" + stars.size + " kept, " + rejects.size + " rejected, " +
    Math.round(url.length/1024*10)/10 + "KB link)";
  o.select();
  try { navigator.clipboard.writeText(url); } catch(e){}
}

const WINDOW = (window.BOARD_META && BOARD_META.windowDays) || 30;
const today = new Date();
const ageDays = d => { const t = Date.parse(d); return isNaN(t) ? 999 : Math.floor((today - t) / 86400000); };
const otherWho = () => who === "ladana" ? "james" : "ladana";

/* Rolling window: unstarred finds age out after windowDays.
   Anything starred by either reviewer stays for good. Rejected finds stay visible
   only while "show rejected" is on — but they are never deleted, because the reject
   list is the training signal. */
function inWindow(f){
  if (stars.has(f.id)) return true;
  const other = new Set(JSON.parse(localStorage.getItem(sKey(otherWho())) || "[]"));
  if (other.has(f.id)) return true;
  if (peer && peer.s && peer.s.includes(f.id)) return true;  // kept by the other reviewer
  return ageDays(f.firstSeen) <= WINDOW;
}
const peerName = () => peer ? (peer.w === "ladana" ? "Ladana" : "James") : "";
const peerStarred  = id => !!(peer && peer.s && peer.s.includes(id));
const peerRejected = id => !!(peer && peer.r && peer.r[id]);

document.getElementById("who").value = who;
document.getElementById("meta").textContent =
  (BOARD_META.updated || "") + (BOARD_META.runLabel ? " — " + BOARD_META.runLabel : "");
document.getElementById("note").textContent = BOARD_META.note || "";

function setWho(){
  who = document.getElementById("who").value;
  localStorage.setItem("fk-who", who);
  stars   = new Set(JSON.parse(localStorage.getItem(sKey(who)) || "[]"));
  rejects = new Map(Object.entries(JSON.parse(localStorage.getItem(rKey(who)) || "{}")));
  peer    = readPeer();
  save(); render();
}
function save(){
  /* Always write locally first — the board keeps working with no network —
     then push to the server if one is configured. */
  localStorage.setItem(sKey(who), JSON.stringify([...stars]));
  localStorage.setItem(rKey(who), JSON.stringify(Object.fromEntries(rejects)));
  document.getElementById("tally").textContent =
    stars.size + " starred · " + rejects.size + " rejected";
  queueSave();
}
/* Starring and rejecting are mutually exclusive. Starring something clears its reject. */
function toggleStar(id){
  userActed = true;
  if(stars.has(id)) stars.delete(id);
  else { stars.add(id); rejects.delete(id); }
  save(); render();
}
function setReject(id, reason){
  userActed = true;
  if(rejects.get(id) === reason) rejects.delete(id);
  else { rejects.set(id, reason); stars.delete(id); }
  save(); render();
}
function clearReject(id){ userActed = true; rejects.delete(id); save(); render(); }

function buildFilters(){
  const el = document.getElementById("filters");
  const live = FINDS.filter(inWindow);
  const laneCounts = {}, bucketCounts = {}, terrCounts = {};
  live.forEach(f => {
    laneCounts[f.lane] = (laneCounts[f.lane] || 0) + 1;
    bucketCounts[f.bucket] = (bucketCounts[f.bucket] || 0) + 1;
    if(f.territory) terrCounts[f.territory] = (terrCounts[f.territory] || 0) + 1;
  });
  /* Curated = passed the full premium bar. Sweep = the product half, shown
     ungated so the reject buttons can teach the filter. */
  const nSweep = live.filter(f => f.tier === "sweep").length;
  let h = '';
  if(nSweep){
    h += '<span class="flabel">Tier</span>';
    h += chip("all", fTier === "all", "tier", "All " + live.length);
    h += chip("curated", fTier === "curated", "tier", "Curated " + (live.length - nSweep));
    h += chip("sweep", fTier === "sweep", "tier", "Product sweep " + nSweep);
    h += '<span style="flex-basis:100%;height:0"></span>';
  }
  h += '<span class="flabel">Territory</span>';
  h += chip("all", fTerr === "all", "terr", "All");
  Object.keys(TERR).forEach(t => {
    if(!terrCounts[t]) return;
    h += chip(t, fTerr === t, "terr", TERR[t] + " " + terrCounts[t]);
  });
  h += '<span style="flex-basis:100%;height:0"></span>';
  h += '<span class="flabel">Lane</span>';
  h += chip("all", fLane === "all", "lane", "All " + live.length);
  Object.keys(LANES).forEach(l => {
    if(!laneCounts[l]) return;
    h += chip(l, fLane === l, "lane", LANES[l] + " " + laneCounts[l]);
  });
  h += '<span style="flex-basis:100%;height:0"></span>';
  h += '<span class="flabel">Bucket</span>';
  h += chip("all", fBucket === "all", "bucket", "All");
  Object.keys(NAMES).forEach(b => {
    if(!bucketCounts[b]) return;
    h += chip(b, fBucket === b, "bucket", NAMES[b] + " " + bucketCounts[b]);
  });
  h += '<span style="flex-basis:100%;height:0"></span>';
  h += chip("star", fStar, "flag", "★ Starred only");
  h += chip("new", fNew, "flag", "New this week");
  h += chip("rej", fShowRej, "flag", "Show rejected " + rejects.size);
  if(peer) h += chip("peer", fPeer, "flag", peerName() + " kept " + (peer.s || []).length);
  el.innerHTML = h;
  el.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const k = c.dataset.kind, v = c.dataset.val;
    if(k === "lane") fLane = v;
    else if(k === "bucket") fBucket = v;
    else if(k === "terr") fTerr = v;
    else if(k === "tier") fTier = v;
    else if(v === "star") fStar = !fStar;
    else if(v === "new") fNew = !fNew;
    else if(v === "rej") fShowRej = !fShowRej;
    else if(v === "peer") fPeer = !fPeer;
    render();
  });
}
function chip(val, on, kind, label){
  return '<span class="chip' + (on ? " on" : "") + '" data-kind="' + kind +
         '" data-val="' + val + '">' + label + '</span>';
}

function visible(){
  return FINDS.filter(inWindow)
    .filter(f => fShowRej || !rejects.has(f.id))
    .filter(f => fLane === "all" || f.lane === fLane)
    .filter(f => fBucket === "all" || f.bucket === fBucket)
    .filter(f => fTerr === "all" || f.territory === fTerr)
    .filter(f => fTier === "all" || (fTier === "sweep" ? f.tier === "sweep" : f.tier !== "sweep"))
    .filter(f => !fStar || stars.has(f.id))
    .filter(f => !fPeer || peerStarred(f.id))
    .filter(f => !fNew || ageDays(f.firstSeen) <= 7);
}

function line(f){
  let t = "\n- **" + f.title + "** — " + f.brand + "  \n";
  t += "  id: " + f.id + " | lane: " + (LANES[f.lane] || f.lane) +
       " | territory: " + (TERR[f.territory] || f.territory || "—") +
       " | class: " + (f.class || "—") +
       (f.score != null ? " | score: " + f.score + "/6" : "") +
       " | first seen: " + f.firstSeen + "\n";
  if(f.swatches) t += "  palette: " + f.swatches.map((s,i) =>
    (f.swatchNames ? f.swatchNames[i] + " " : "") + s).join(", ") + "\n";
  t += "  ingredient: " + f.note + "\n";
  if(f.tags && f.tags.length) t += "  tags: " + f.tags.join(", ") + "\n";
  t += "  source: " + f.source + "\n";
  if(f.img) t += "  image: " + f.img + "\n";
  /* Where both reviewers have marked the same find, say so — agreement and
     disagreement are both stronger signals than one person's opinion. */
  if(peerStarred(f.id))  t += "  " + peerName() + ": KEPT\n";
  if(peerRejected(f.id)) t += "  " + peerName() + ": REJECTED — " +
    (REASONS[peer.r[f.id]] || peer.r[f.id]) + "\n";
  return t;
}

function picks(){
  const kept = FINDS.filter(f => stars.has(f.id));
  const rej  = FINDS.filter(f => rejects.has(f.id));
  const name = who === "ladana" ? "Ladana" : "James";
  let txt = "# Board review — " + name + " — " + new Date().toISOString().slice(0,10) + "\n\n" +
            kept.length + " kept · " + rej.length + " rejected.\n";
  if(peer){
    const bothKept = kept.filter(f => peerStarred(f.id)).map(f => f.id);
    const split    = kept.filter(f => peerRejected(f.id)).map(f => f.id);
    txt += "\nIncludes " + peerName() + "'s review from " + (peer.at || "an earlier session") + ".\n";
    if(bothKept.length) txt += "Both kept: " + bothKept.join(", ") + "\n";
    if(split.length)    txt += "Disagreed (" + name + " kept, " + peerName() +
                               " rejected): " + split.join(", ") + "\n";
  }

  txt += "\n\n# KEEP\n";
  if(!kept.length) txt += "\nNothing starred.\n";
  else Object.keys(NAMES).forEach(b => {
    const items = kept.filter(f => f.bucket === b);
    if(!items.length) return;
    txt += "\n## " + NAMES[b] + "\n";
    items.forEach(f => { txt += line(f); });
  });

  txt += "\n\n# REJECT\n";
  if(!rej.length) txt += "\nNothing rejected.\n";
  else {
    /* Grouped by reason, because the reason is the rule the collector has to learn.
       Three rejects sharing a reason is a pattern, not three opinions. */
    Object.keys(REASONS).forEach(r => {
      const items = rej.filter(f => rejects.get(f.id) === r);
      if(!items.length) return;
      txt += "\n## " + REASONS[r] + "  (" + items.length + ")\n";
      items.forEach(f => { txt += line(f); });
    });
  }

  txt += "\n---\nPaste this whole thing back into Claude. Keeps become keeper cards and " +
         "direction sheets; rejects are written into REJECTS.md and become filter rules " +
         "the collector applies on the next run.\n";

  const o = document.getElementById("out");
  o.style.display = "block"; o.value = txt; o.select();
  try { navigator.clipboard.writeText(txt); } catch(e){}
}

function render(){
  buildFilters();
  const list = visible();
  const byB = {};
  list.forEach(f => (byB[f.bucket] = byB[f.bucket] || []).push(f));
  const el = document.getElementById("board");
  el.innerHTML = "";
  Object.keys(NAMES).forEach(b => {
    const items = byB[b];
    if(!items || !items.length) return;
    const h = document.createElement("h2");
    h.innerHTML = NAMES[b] + '<span class="bcount">' + items.length + '</span>';
    el.appendChild(h);
    const g = document.createElement("div");
    g.className = "grid";
    items.forEach(f => {
      const isRej = rejects.has(f.id);
      const c = document.createElement("div");
      c.className = "card" + (stars.has(f.id) ? " starred" : "") + (isRej ? " rejected" : "");
      let visual;
      if(f.swatches){
        visual = '<div class="sw">' + f.swatches.map(s =>
          '<div style="background:' + s + '"></div>').join("") + '</div>';
      } else {
        visual = '<img class="thumb" loading="lazy" alt="' + f.title +
          '" src="' + f.img + '" onerror="this.style.opacity=.25">';
      }
      const hex = f.swatches
        ? '<div class="hex">' + f.swatches.map((s,i) =>
            (f.swatchNames ? f.swatchNames[i] + " " : "") + s).join(" · ") + '</div>'
        : "";
      const tags = (f.tags || []).map(t => '<span class="tag">' + t + '</span>').join("");
      const isNew = ageDays(f.firstSeen) <= 1;
      const clsBadge = f.class === "reference"
        ? '<span class="cls" style="background:var(--ref)">reference</span>'
        : '<span class="badge">' + (LANES[f.lane] || f.lane) + '</span>';
      const terrBadge = f.territory
        ? '<span class="terr">' + (TERR[f.territory] || f.territory) + '</span>' : '';
      const scoreBadge = f.score != null
        ? '<span class="scr">' + f.score + '/6' + (f.tier === "sweep" ? ' · sweep' : '') + '</span>' : '';
      const peerBadge = peerStarred(f.id)
        ? '<span class="peer star">★ ' + peerName() + '</span>'
        : (peerRejected(f.id)
            ? '<span class="peer rejd">✕ ' + peerName() + ' — ' + (REASONS[peer.r[f.id]] || peer.r[f.id]) + '</span>'
            : '');
      const reasonChips = Object.keys(REASONS).map(r =>
        '<span class="rc' + (rejects.get(f.id) === r ? " on" : "") +
        '" data-r="' + r + '">' + REASONS[r] + '</span>').join("");

      c.innerHTML =
        '<div class="vwrap">' + visual + clsBadge + terrBadge +
        (isNew ? '<span class="newdot">new</span>' : '') + scoreBadge + '</div>' +
        (isRej ? '<div class="rlabel">Rejected — ' + REASONS[rejects.get(f.id)] + '</div>' : '') +
        peerBadge +
        '<div class="body"><div class="t">' + f.title + '</div>' +
        '<div class="b">' + f.brand + '</div>' + hex +
        '<div class="n">' + f.note + '</div>' +
        '<div class="tags">' + tags + '</div></div>' +
        '<div class="foot">' +
          '<button class="star' + (stars.has(f.id) ? " on" : "") +
            '" title="Keep this">' + (stars.has(f.id) ? "★" : "☆") + '</button>' +
          '<button class="rej' + (isRej ? " on" : "") + '" title="Reject this">✕</button>' +
          '<a href="' + f.source + '" target="_blank" rel="noopener">source</a>' +
          '<span class="seen">' + f.firstSeen + '</span>' +
        '</div>' +
        '<div class="why' + (isRej ? " open" : "") + '">' + reasonChips + '</div>';

      c.querySelector(".star").onclick = () => toggleStar(f.id);
      c.querySelector(".rej").onclick = () => {
        const why = c.querySelector(".why");
        if(isRej) clearReject(f.id);          // already rejected → un-reject
        else why.classList.toggle("open");    // otherwise reveal the reason chips
      };
      c.querySelectorAll(".rc").forEach(chip =>
        chip.onclick = () => setReject(f.id, chip.dataset.r));
      g.appendChild(c);
    });
    el.appendChild(g);
  });
  if(!list.length) el.innerHTML = '<p class="empty">Nothing matches these filters.</p>';
}
render(); save(); loadSharedReviews();
</script>
</body>
</html>
